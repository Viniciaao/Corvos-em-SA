; ===========================================================================
;  CORVOS DO GTA V - configuracao
;
;  Copie este arquivo para a pasta CLEO do seu GTA (CLEO/CORVOS.ini).
;  Se ele nao existir, o proprio script cria um igual a este na primeira vez
;  que o jogo abre -- ai e so editar e salvar.
;
;  Detalhe importante: "numero_de_corvos" e as duas opcoes de clima sao lidas
;  quando o jogo carrega a partida (ou quando o script reinicia) -- para mudar
;  essas, reinicie o jogo. Som e tempos sao lidos na hora, nao precisa reiniciar.
;
;  Linhas comecando com ; sao comentarios.
; ===========================================================================

[corvos]

; Quantos corvos podem existir ao mesmo tempo (1 a 5).
; 0 ou valor em branco = 5 (padrao).
numero_de_corvos = 5

; O corvo pode nascer com chuva?      0 = nao (padrao)   1 = sim
nascer_na_chuva = 0

; O corvo pode nascer na tempestade de areia (Las Venturas)?
;                                     0 = nao (padrao)   1 = sim
nascer_na_tempestade_de_areia = 0

; De quantos em quantos segundos um corvo pousado pode grasnar (em media).
;                                      0 = nunca grasna   (maximo 120)
grasnado_a_cada = 9

; Volume dos sons, de 0.0 (mudo) a 1.0 (volume cheio).
volume_grasnado = 0.7
volume_asas = 0.5

; Desliga TODO o som do mod (0 = som ligado, 1 = mudo).
desligar_som = 0

; Tempo minimo, em milissegundos, entre o nascimento de um corvo e o proximo.
;                                      0 = sem espera (padrao do mod: 500)
tempo_entre_corvos = 500

; Tempo, em milissegundos, para um corvo voltar a nascer depois que um saiu
; (morreu, foi embora, foi apagado).
;                                      0 = sem espera (padrao do mod: 10000)
tempo_para_renascer = 10000
