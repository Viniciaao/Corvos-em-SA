; ===========================================================================
;  CORVOS DO GTA V - configuracao
;
;  Copie este arquivo para a pasta CLEO do seu GTA (CLEO/CORVOS.ini).
;  Se ele nao existir, o proprio script cria um igual a este na primeira vez
;  que o jogo abre -- ai e so editar e salvar.
;
;  Detalhe importante: o script le a configuracao quando o jogo carrega a
;  partida. Depois de mudar algo aqui, reinicie o jogo para valer.
;
;  Linhas comecando com ; sao comentarios.
; ===========================================================================

[corvos]

; Quantos corvos podem existir ao mesmo tempo (1 a 5).
; 0 ou valor em branco = 5 (padrao).
numero_de_corvos = 5

; O corvo pode nascer com chuva?      0 = nao (padrao)   1 = sim
nascer_na_chuva = 0

; O corvo pode nascer na tempestade de areia (Las Venturas)?
;                                     0 = nao (padrao)   1 = sim
nascer_na_tempestade_de_areia = 0

; De quantos em quantos segundos um corvo pousado pode grasnar (em media).
;                                      0 = nunca grasna   (maximo 120)
grasnado_a_cada = 12

; Volume dos dois sons, de 0.0 (mudo) a 1.0 (volume cheio).
; O grasnado toca uma vez; as asas ficam tocando em laco enquanto o corvo voa.
volume_grasnado = 0.6
volume_asas = 0.4

; Desliga TODO o som do mod (0 = som ligado, 1 = mudo).
desligar_som = 0

; Tempo minimo, em milissegundos, entre o nascimento de um corvo e o proximo.
tempo_entre_corvos = 250

; Tempo, em milissegundos, para um corvo voltar a nascer depois que um saiu
; (morreu, foi embora, foi apagado).
tempo_para_renascer = 3000

; ===========================================================================
;  O resto nao esta no INI porque e' ajustado no fonte (src/CORVOS.sc, parte
;  CONFIGURACAO) -- para mudar isso e' preciso recompilar (tools/build.sh):
;
;    o corvo nasce entre 25 m e 90 m do jogador (nem colado, nem longe);
;    dois corvos pousados ficam a pelo menos 4 m um do outro;
;    o som so toca a menos de 30 m do jogador;
;    o corvo "esquece" o jogador (e desaparece, se estiver fora da tela)
;    a mais de 100 m;
;    vida do corvo, velocidade de voo, altitude de cruzeiro e distancias de
;    alerta (jogador, pedestre, fogo, carro).
;
; COMO OS CORVOS APARECEM
; -----------------------
; O mapa tem 13 regioes (as mesmas do mod original). Dentro de uma regiao o
; corvo nasce no poleiro mais perto do jogador que estiver livre, de
; preferencia fora da camera. Depois que os corvos de um lugar vao embora
; (levantam voo ou sao soltos por distancia), NENHUM outro corvo nasce ate o
; jogador se afastar 200 m daquela regiao: e' so voltar depois para ver os
; corvos de novo.
; ===========================================================================
